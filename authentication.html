  <div class="auth-block">
    <h1>Login to the system</h1>
    <form action="https://httpbin.org/post" method="post" enctype="multipart/form-data">
      
      <label for="login"><h2>Username:</h2></label>
      <input type="text" id="login" name="login" required placeholder="Steve">

      <label for="password"><h2>Password:</h2></label>
      <input type="password" id="password" name="password" required placeholder="••••••••">

      <label class="checkbox-label">
        <input type="checkbox" id="remember" name="remember">
        <h2>Remember me</h2>
      </label>

      <button type="submit"><h3>Login</h3></button>
    </form>
  </div>
